name: Сборка APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle и Kotlin скачиваются с github.com, который иногда отвечает 504. Кэш убирает эти скачивания.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Проверка кода
        run: flutter analyze

      # Сборщик sqlite3 для тестов скачивает библиотеку с github.com. При сбое сети приходит не тот файл,
      # поэтому сначала скачиваем её отдельным коротким прогоном с повтором. Сами тесты идут один раз, ниже.
      - name: Библиотеки для тестов
        run: |
          for attempt in 1 2 3; do
            if flutter test test/calc_test.dart > /dev/null; then exit 0; fi
            echo "Не скачалось, попытка $attempt из 3. Повтор через 30 секунд."
            rm -rf .dart_tool/hooks_runner
            sleep 30
          done
          exit 1

      - name: Тесты
        run: flutter test

      - name: Свой ключ подписи, если он есть в секретах
        env:
          KEYSTORE_BASE64: ${{ secrets.PLANER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/planer.jks"
            echo "PLANER_KEYSTORE_PATH=$RUNNER_TEMP/planer.jks" >> "$GITHUB_ENV"
          fi

      - name: Зеркало Maven Central для Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cp .github/gradle/mirror.init.gradle ~/.gradle/init.d/

      - name: Gradle с запасных адресов
        run: |
          # github.com иногда отвечает 504 на скачивание Gradle. Пробуем несколько адресов и даём Gradle готовый файл.
          url="$(grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*=//; s/\\//g')"
          name="$(basename "$url")"
          for attempt in 1 2 3; do
            for src in "$url" \
                "https://downloads.gradle.org/distributions/$name" \
                "https://mirrors.cloud.tencent.com/gradle/$name" \
                "https://github.com/gradle/gradle-distributions/releases/download/v$(echo "$name" | sed 's/gradle-//; s/-.*//')/$name"; do
              echo "Скачиваю $src"
              if curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/$name" "$src" && unzip -tq "$RUNNER_TEMP/$name" > /dev/null; then
                sed -i "s|^distributionUrl=.*|distributionUrl=file\\://$RUNNER_TEMP/$name|" android/gradle/wrapper/gradle-wrapper.properties
                exit 0
              fi
            done
            sleep 20
          done
          echo "Не удалось скачать Gradle заранее, сборка попробует сама."

      - name: Сборка
        env:
          PLANER_KEYSTORE_PASSWORD: ${{ secrets.PLANER_KEYSTORE_PASSWORD }}
          PLANER_KEY_ALIAS: ${{ secrets.PLANER_KEY_ALIAS }}
          PLANER_KEY_PASSWORD: ${{ secrets.PLANER_KEY_PASSWORD }}
        run: |
          # Повтор только из-за сетевых сбоев при скачивании Gradle и Kotlin: ошибка в коде упадёт все три раза.
          for attempt in 1 2 3; do
            if flutter build apk --release --build-number=${{ github.run_number }}; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Сборка не удалась, попытка $attempt из 3. Повтор через 30 секунд."
            sleep 30
          done
          cp build/app/outputs/flutter-apk/app-release.apk planer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planer-apk
          path: planer.apk

      - name: Релиз (ветка main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//').${{ github.run_number }}"
          gh release create "v$version" planer.apk \
            --target "$GITHUB_SHA" \
            --title "Planer $version" \
            --notes "Сборка из main, коммит ${GITHUB_SHA::7}. Скачай planer.apk и установи поверх старой версии."

      - name: Предварительная сборка (другие ветки)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview planer.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Предварительная сборка" \
            --notes "Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}. Для проверки до слияния."
